[package]
name = "devhub"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "CLI for managing local dev projects with readiness probes and an automatic Caddy reverse proxy"
license = "MIT"
repository = "https://github.com/arichyx/devhub"
readme = "README.md"
keywords = ["cli", "development", "process-manager", "caddy", "reverse-proxy"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
eyre = "0.6.12"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"
